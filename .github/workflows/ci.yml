name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run check

  # What releases is the tarball the packed-consumer gate passed, never a fresh pack.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run build
      - run: npm pack && mv slopkit-*.tgz slopkit.tgz
      - run: node scripts/pack-check.ts slopkit.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: slopkit
          path: slopkit.tgz

  # A `v<version>` tag releases `package.json`'s version: the github release, then npm.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: slopkit
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match package.json's $version"
            exit 1
          fi
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" slopkit.tgz --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  # Trusted publishing: npm trusts this workflow, no token. A version is published once.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: actions/download-artifact@v8
        with:
          name: slopkit
      - name: Publish if new
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          # Unpublished only on the registry's own 404: any other failure (network, a bad answer) stops here.
          if view="$(npm view "slopkit@$version" dist.integrity 2>&1)"; then
            if [ -z "$view" ]; then
              echo "::error::the registry answered no integrity for slopkit@$version"
              exit 1
            fi
            built="sha512-$(openssl dgst -sha512 -binary slopkit.tgz | base64 -w0)"
            if [ "$built" != "$view" ]; then
              echo "::error::slopkit@$version is published with other contents: bump the version"
              exit 1
            fi
            echo "slopkit@$version is already published, and is this package"
            exit 0
          elif ! grep -q E404 <<<"$view"; then
            echo "::error::couldn't ask the registry about slopkit@$version: $view"
            exit 1
          fi
          npm publish slopkit.tgz --access public
